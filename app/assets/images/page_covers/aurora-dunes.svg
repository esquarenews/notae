<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Aurora dunes</title>
  <desc id="desc">Layered aurora-style gradient over dune contours.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ad7d3"/>
      <stop offset="45%" stop-color="#6fb6c4"/>
      <stop offset="100%" stop-color="#355a74"/>
    </linearGradient>
    <linearGradient id="dune" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0c27b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7f5539" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" fill="url(#sky)"/>
  <path d="M0 350 C220 310 340 420 560 380 C760 344 940 246 1200 286 C1380 314 1500 368 1600 350 L1600 520 L0 520 Z"
