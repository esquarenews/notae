development:
  adapter: async

test:
  adapter: test

production:
  adapter: <%= ENV.fetch("ACTION_CABLE_ADAPTER", "async") %>
  <% if ENV.fetch("ACTION_CABLE_ADAPTER", "async") == "redis" %>
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  <% end %>
  channel_prefix: notae_production
