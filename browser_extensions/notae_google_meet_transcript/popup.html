<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notae Meet Transcript</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        width: 320px;
        background: #f6f8fb;
        color: #1f2937;
      }

      .shell {
        padding: 16px;
        display: grid;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.3;
      }

      p,
      label,
      button,
      input {
        font-size: 13px;
      }

      .hint,
      .status {
        margin: 0;
        color: #4b5563;
        line-height: 1.4;
      }

      .status.is-error {
        color: #b91c1c;
      }

      .status.is-success {
        color: #047857;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 9px 10px;
        background: #fff;
      }

      .field-action {
        justify-self: start;
        padding: 7px 10px;
        font-size: 12px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #1f2937;
        border-radius: 8px;
        padding: 9px 12px;
        cursor: pointer;
      }

      button.primary {
        background: #1f2937;
        color: #fff;
        border-color: #1f2937;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 10px;
        background: #e5eefc;
        color: #1d4ed8;
        font-size: 12px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div>
        <h1>Notae Google Meet Transcript</h1>
        <p class="hint">Turn on captions in Google Meet, then start capture here.</p>
      </div>

      <div id="tabState" class="pill hidden"></div>

      <label class="field">
        <span>Notae base URL</span>
        <input id="baseUrl" type="url" placeholder="http://localhost:4000">
      </label>

      <label class="field">
        <span>Workspace slug</span>
        <input id="workspaceSlug" type="text" placeholder="workspace-slug">
      </label>

      <div class="field">
        <button id="detectedWorkspaceButton" type="button" class="hidden">Use detected workspace</button>
        <p id="detectedWorkspaceHint" class="hint hidden"></p>
      </div>

      <label class="field">
        <span>Extension token</span>
        <input id="apiToken" type="password" placeholder="Paste token from Notae">
        <button id="pasteTokenButton" type="button" class="field-action">Paste token</button>
      </label>

      <div class="actions">
        <button id="saveButton">Save settings</button>
        <button id="startButton" class="primary">Start capture</button>
        <button id="stopButton" class="hidden">Stop &amp; sync</button>
        <button id="openNotaButton" class="hidden">Open Nota</button>
      </div>

      <p id="statusMessage" class="status">Ready.</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
